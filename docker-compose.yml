services:
  orchestrator:
    build:
      context: ./services/assistant
    command: ["python", "-m", "app.orchestrator"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKFLOW_ENGINE: ${WORKFLOW_ENGINE:-db}
      DATABASE_URL: ${DATABASE_URL:-postgresql://assistant:assistant@postgres:5432/assistant}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OBSIDIAN_VAULT_PATH: ${OBSIDIAN_VAULT_PATH:-/obsidian}
      PRIMARY_PROVIDER: ${PRIMARY_PROVIDER:-deepseek}
      FALLBACK_PROVIDER: ${FALLBACK_PROVIDER:-ollama}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
      QUIET_HOURS: ${QUIET_HOURS:-"22:00-07:00"}
      BACKGROUND_POLL_INTERVAL: ${BACKGROUND_POLL_INTERVAL:-3600}
      INGEST_SYNTHETIC_SIGNALS: ${INGEST_SYNTHETIC_SIGNALS:-false}
      DEFAULT_USER_ID: ${DEFAULT_USER_ID:-}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./obsidian-vault:/obsidian
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; url='http://127.0.0.1:8000/ready';\ntry:\n  urllib.request.urlopen(url, timeout=2).read();\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\n"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ./services/assistant
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKFLOW_ENGINE: ${WORKFLOW_ENGINE:-db}
      DATABASE_URL: ${DATABASE_URL:-postgresql://assistant:assistant@postgres:5432/assistant}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OBSIDIAN_VAULT_PATH: ${OBSIDIAN_VAULT_PATH:-/obsidian}
      PRIMARY_PROVIDER: ${PRIMARY_PROVIDER:-deepseek}
      FALLBACK_PROVIDER: ${FALLBACK_PROVIDER:-ollama}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      NOOP_DURATION_SECONDS: ${NOOP_DURATION_SECONDS:-2}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      BRAVE_SEARCH_API_BASE: ${BRAVE_SEARCH_API_BASE:-}
      BRAVE_SEARCH_MAX_RESULTS: ${BRAVE_SEARCH_MAX_RESULTS:-5}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./obsidian-vault:/obsidian
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; url='http://127.0.0.1:8001/ready';\ntry:\n  urllib.request.urlopen(url, timeout=2).read();\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\n"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  baileys:
    image: node:20
    working_dir: /app
    command: ["sh", "-c", "npm install && npm start"]
    environment:
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
    volumes:
      - ./services/baileys:/app
      - baileys_auth:/app/auth
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant}
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgresql
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: ${TEMPORAL_POSTGRES_DB:-temporal}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    depends_on:
      - temporal-postgres
    profiles: ["local", "prod"]
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.27
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal
    profiles: ["local", "prod"]
    restart: unless-stopped

  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: ${TEMPORAL_POSTGRES_DB:-temporal}
    volumes:
      - temporal_data:/var/lib/postgresql/data
    profiles: ["local", "prod"]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["offline"]
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["prod"]
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    profiles: ["local", "prod"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: ["local", "prod"]
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: services/migrate/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://assistant:assistant@postgres:5432/assistant}
      MIGRATIONS_PATH: ${MIGRATIONS_PATH:-/app/migrations}
      MIGRATE_DB_TIMEOUT_SECONDS: ${MIGRATE_DB_TIMEOUT_SECONDS:-60}
      MIGRATE_DB_RETRY_SECONDS: ${MIGRATE_DB_RETRY_SECONDS:-2}
    depends_on:
      - postgres
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  baileys_auth:
  temporal_data:
  ollama_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
